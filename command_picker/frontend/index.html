<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>command picker</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: transparent;
        height: 100%;
      }
      #canvas-command-picker-host {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        height: 100%;
        width: 100%;
        padding: 0 1rem 0.85rem;
        font-family: Source Sans, Source Sans 3, sans-serif;
      }
      #canvas-command-picker-host * { box-sizing: border-box; }
      #canvas-command-picker-host[data-busy="true"] .command-picker-row { opacity: 0.72; }
      #canvas-command-picker-host[data-busy="true"] .command-picker-send { cursor: wait; }
      #canvas-command-picker-menu {
        width: 100%;
        min-width: 0;
        max-height: 340px;
        overflow: auto;
        margin: 0 0 0.45rem;
        padding: 0.35rem;
        border: 1px solid var(--picker-border, rgba(49, 51, 63, 0.2));
        border-radius: 0.6rem;
        background: var(--picker-bg, #ffffff);
        color: var(--picker-text, #31333f);
        box-shadow: 0 8px 24px rgba(49, 51, 63, 0.18);
      }
      #canvas-command-picker-menu[hidden] { display: none !important; }
      .command-picker-item {
        appearance: none;
        -webkit-appearance: none;
        display: block;
        width: 100%;
        text-align: left;
        margin: 0;
        padding: 0.45rem 0.6rem;
        border: 0;
        border-radius: 0.4rem;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      .command-picker-item[data-active="true"],
      .command-picker-item:hover {
        background: var(--picker-secondary, #f0f2f6);
      }
      .command-picker-item:focus-visible {
        outline: 2px solid var(--picker-primary, #ff4b4b);
        outline-offset: -2px;
      }
      .command-picker-token {
        display: block;
        font-weight: 600;
        font-size: 0.92rem;
      }
      .command-picker-desc {
        display: block;
        font-size: 0.8rem;
        opacity: 0.8;
        line-height: 1.35;
        margin-top: 0.1rem;
      }
      .command-picker-row {
        display: flex;
        align-items: flex-end;
        gap: 0.35rem;
        width: 100%;
        min-height: 3.15rem;
        padding: 0.35rem 0.45rem 0.35rem 0.4rem;
        border-radius: 1.6rem;
        background: var(--picker-secondary, #f0f2f6);
        color: var(--picker-text, #31333f);
      }
      .command-picker-icon,
      .command-picker-send {
        appearance: none;
        -webkit-appearance: none;
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 2.15rem;
        height: 2.15rem;
        margin: 0 0 0.1rem;
        padding: 0;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: inherit;
        cursor: pointer;
      }
      .command-picker-icon:hover,
      .command-picker-send:hover { color: var(--picker-primary, #ff4b4b); }
      .command-picker-icon:focus-visible,
      .command-picker-send:focus-visible {
        outline: 2px solid var(--picker-primary, #ff4b4b);
        outline-offset: 2px;
      }
      .command-picker-icon svg,
      .command-picker-send svg { width: 18px; height: 18px; display: block; }
      textarea.command-picker-input {
        flex: 1 1 auto;
        min-width: 0;
        border: 0;
        background: transparent;
        color: inherit;
        font: inherit;
        font-size: 1rem;
        line-height: 1.4;
        outline: none;
        padding: 0.45rem 0.2rem 0.35rem;
        resize: none;
        overflow-y: auto;
        min-height: 1.4em;
        max-height: 12.6em;
        field-sizing: content;
      }
      .command-picker-input::placeholder { opacity: 0.55; }
    </style>
  </head>
  <body>
    <div id="canvas-command-picker-host" data-canvas-command-picker="1">
      <div id="canvas-command-picker-menu" role="listbox" aria-label="Commands" hidden></div>
      <div class="command-picker-row">
        <button type="button" class="command-picker-icon" aria-label="Commands" title="Commands" aria-haspopup="listbox" aria-expanded="false" aria-controls="canvas-command-picker-menu"></button>
        <textarea
          class="command-picker-input"
          rows="1"
          autocomplete="off"
          spellcheck="false"
          data-testid="command-picker-input"
          aria-label="Chat message"
        ></textarea>
        <button type="button" class="command-picker-send" aria-label="Send" title="Send"></button>
      </div>
    </div>
    <script>
      (function () {
        var API = 1;
        var lastArgsKey = "";
        var lastTheme = null;
        var liveCommands = [];
        var livePlaceholder = "What's due this week?";
        var liveStyleId = "canvas-command-picker-style";
        var iconOpen = false;
        var dismissed = false;
        var highlight = -1;
        var placeHooked = false;
        var insetRO = null;
        var observedNodes = [];
        var placeRaf = 0;
        var built = false;
        var localBusy = false;
        var LINE = 22;
        var MAX_LINES = 9;
        var MENU_MAX = 360;
        var PAD = 28;

        var host = document.getElementById("canvas-command-picker-host");
        var menu = document.getElementById("canvas-command-picker-menu");
        var input = host.querySelector(".command-picker-input");
        var iconBtn = host.querySelector(".command-picker-icon");
        var sendBtn = host.querySelector(".command-picker-send");

        function send(type, data) {
          var payload = Object.assign({ isStreamlitMessage: true, type: type }, data || {});
          window.parent.postMessage(payload, "*");
        }

        function setFrameHeight(height) {
          send("streamlit:setFrameHeight", { height: height });
        }

        function setComponentValue(value) {
          send("streamlit:setComponentValue", { value: value, dataType: "json" });
        }

        function parentWin() {
          try {
            if (window.parent && window.parent !== window) return window.parent;
          } catch (err) {}
          return window;
        }

        function parentDoc() {
          try {
            var doc = parentWin().document;
            if (doc && doc.documentElement) return doc;
          } catch (err) {}
          return null;
        }

        function themeVars(theme) {
          theme = theme || {};
          return {
            background: theme.backgroundColor || "#ffffff",
            secondary: theme.secondaryBackgroundColor || "#f0f2f6",
            text: theme.textColor || "#31333f",
            primary: theme.primaryColor || "#ff4b4b",
            font: theme.font || "Source Sans, Source Sans 3, sans-serif",
            border: "rgba(49, 51, 63, 0.2)",
          };
        }

        function applyTheme(theme) {
          var vars = themeVars(theme);
          var root = document.documentElement;
          root.style.setProperty("--picker-bg", vars.background);
          root.style.setProperty("--picker-secondary", vars.secondary);
          root.style.setProperty("--picker-text", vars.text);
          root.style.setProperty("--picker-primary", vars.primary);
          root.style.setProperty("--picker-border", vars.border);
          host.style.fontFamily = vars.font;
          document.body.style.background = vars.background;
        }

        function ensureParentStyle(doc, css) {
          var el = doc.getElementById(liveStyleId);
          if (!el) {
            el = doc.createElement("style");
            el.id = liveStyleId;
            doc.head.appendChild(el);
          }
          el.textContent = css;
        }

        function readInsets(doc) {
          var win = parentWin();
          var vw = win.innerWidth || (doc.documentElement && doc.documentElement.clientWidth) || 0;
          var left = 0;
          var sidebar = doc.querySelector('[data-testid="stSidebar"]');
          if (sidebar) {
            var expanded = sidebar.getAttribute("aria-expanded");
            var sr = sidebar.getBoundingClientRect();
            var visible =
              expanded !== "false" &&
              sr.width > 8 &&
              sr.right > 8 &&
              sr.left < vw / 2;
            if (visible) left = Math.round(sr.right);
          }
          var right = 0;
          var rail = doc.getElementById("canvas-files-rail-host");
          if (rail && rail.getAttribute("data-collapsed") !== "true") {
            var rr = rail.getBoundingClientRect();
            if (rr.width > 8 && rr.left < vw) {
              right = Math.round(Math.max(0, vw - rr.left));
            }
          }
          return { left: left, right: right, vw: vw };
        }

        function sidebarLeft(doc) {
          return readInsets(doc).left;
        }

        function railRight(doc) {
          return readInsets(doc).right;
        }

        function menuOpen() {
          return !!(menu && !menu.hidden);
        }

        function autosize() {
          input.style.height = "auto";
          var next = Math.min(LINE * MAX_LINES, Math.max(LINE, input.scrollHeight));
          input.style.height = next + "px";
          return next;
        }

        function barHeight() {
          var row = host.querySelector(".command-picker-row");
          var h = row ? row.getBoundingClientRect().height : 50;
          return Math.round(h + PAD);
        }

        function pinIframe(height) {
          var iframe = window.frameElement;
          var doc = parentDoc();
          var box = doc ? readInsets(doc) : { left: 0, right: 0, vw: 0 };
          var left = box.left;
          var right = box.right;
          if (iframe) {
            iframe.setAttribute("data-canvas-command-picker-frame", "1");
            iframe.setAttribute("data-inset-left", String(left));
            iframe.setAttribute("data-inset-right", String(right));
            iframe.style.cssText =
              "position:fixed!important;left:" +
              left +
              "px!important;right:" +
              right +
              "px!important;bottom:0!important;width:calc(100% - " +
              (left + right) +
              "px)!important;height:" +
              height +
              "px!important;border:0!important;z-index:1000018!important;background:transparent!important;";
            var wrap = iframe.parentElement;
            if (wrap) {
              wrap.style.cssText =
                "height:0!important;min-height:0!important;margin:0!important;" +
                "padding:0!important;overflow:visible!important;border:0!important;";
            }
          }
          if (doc) {
            ensureParentStyle(
              doc,
              "html { --canvas-command-picker-height: " +
                height +
                "px; }\n" +
                '[data-testid="stAppScrollToBottomContainer"],' +
                '[data-testid="stMain"] {' +
                " padding-bottom: var(--canvas-command-picker-height) !important; }\n" +
                'iframe[data-canvas-command-picker-frame="1"] { background: transparent !important; }'
            );
          }
          setFrameHeight(height);
        }

        function layout() {
          autosize();
          var extra = 0;
          if (menuOpen()) {
            extra = Math.min(MENU_MAX, menu.scrollHeight + 12);
          }
          pinIframe(barHeight() + extra);
        }

        function setBusy(on) {
          localBusy = !!on;
          host.setAttribute("data-busy", localBusy ? "true" : "false");
          host.setAttribute("aria-busy", localBusy ? "true" : "false");
          sendBtn.disabled = localBusy;
          sendBtn.setAttribute("title", localBusy ? "Checking Canvas…" : "Send");
          // Keep the textarea usable so queued keystrokes are not dropped.
          input.removeAttribute("disabled");
        }

        function draftBucket() {
          try {
            var win = parentWin();
            if (!win.__canvasCommandPickerDraft) {
              win.__canvasCommandPickerDraft = { text: "" };
            }
            return win.__canvasCommandPickerDraft;
          } catch (err) {
            return { text: "" };
          }
        }

        function saveDraft() {
          draftBucket().text = input.value;
        }

        function restoreDraft() {
          var saved = draftBucket().text;
          if (saved && !input.value) {
            input.value = saved;
          }
        }

        function clearDraft() {
          draftBucket().text = "";
        }

        function focusComposer() {
          try {
            input.focus({ preventScroll: true });
          } catch (err) {
            try {
              input.focus();
            } catch (focusErr) {}
          }
        }

        function filterCommands(query) {
          var text = (query || "").replace(/^\s+/, "");
          if (!text.startsWith("/")) return [];
          if (/\s/.test(text)) return [];
          var typed = text.slice(1).toLowerCase();
          if (!typed) return liveCommands.slice();
          return liveCommands.filter(function (cmd) {
            return cmd.token.indexOf(typed) === 0;
          });
        }

        function visibleCommands() {
          if (iconOpen) return liveCommands.slice();
          if (dismissed) return [];
          return filterCommands(input.value);
        }

        function insert(token) {
          input.value = "/" + token + " ";
          iconOpen = false;
          highlight = -1;
          saveDraft();
          renderMenu();
          focusComposer();
          input.selectionStart = input.selectionEnd = input.value.length;
        }

        function insertNewline() {
          var start = input.selectionStart;
          var end = input.selectionEnd;
          var value = input.value;
          input.value = value.slice(0, start) + "\n" + value.slice(end);
          input.selectionStart = input.selectionEnd = start + 1;
          saveDraft();
          renderMenu();
          focusComposer();
        }

        function submit() {
          var text = input.value;
          if (!String(text).trim()) return;
          iconOpen = false;
          highlight = -1;
          renderMenu();
          setBusy(true);
          clearDraft();
          setComponentValue({ submit: text, seq: Date.now() });
          input.value = "";
          autosize();
        }

        function renderMenu() {
          var rows = visibleCommands();
          while (menu.firstChild) menu.removeChild(menu.firstChild);
          if (!rows.length) {
            menu.hidden = true;
            iconBtn.setAttribute("aria-expanded", "false");
            layout();
            return;
          }
          if (highlight < 0) highlight = 0;
          if (highlight >= rows.length) highlight = rows.length - 1;
          rows.forEach(function (cmd, index) {
            var item = document.createElement("button");
            item.type = "button";
            item.className = "command-picker-item";
            item.setAttribute("role", "option");
            item.setAttribute("data-token", cmd.token);
            item.setAttribute("data-active", index === highlight ? "true" : "false");
            var token = document.createElement("span");
            token.className = "command-picker-token";
            token.textContent = "/" + cmd.token;
            var desc = document.createElement("span");
            desc.className = "command-picker-desc";
            desc.textContent = cmd.description || "";
            item.appendChild(token);
            item.appendChild(desc);
            item.addEventListener("mousedown", function (event) {
              event.preventDefault();
              insert(cmd.token);
            });
            menu.appendChild(item);
          });
          menu.hidden = false;
          iconBtn.setAttribute("aria-expanded", "true");
          layout();
        }

        function moveHighlight(delta) {
          var rows = visibleCommands();
          if (!rows.length) return;
          if (highlight < 0) highlight = delta > 0 ? 0 : rows.length - 1;
          else highlight = (highlight + delta + rows.length) % rows.length;
          renderMenu();
        }

        function svg(pathD) {
          var svgEl = document.createElementNS("http://www.w3.org/2000/svg", "svg");
          svgEl.setAttribute("viewBox", "0 0 24 24");
          svgEl.setAttribute("aria-hidden", "true");
          svgEl.setAttribute("focusable", "false");
          var path = document.createElementNS("http://www.w3.org/2000/svg", "path");
          path.setAttribute("d", pathD);
          path.setAttribute("fill", "currentColor");
          svgEl.appendChild(path);
          return svgEl;
        }

        function bindOnce() {
          if (built) return;
          built = true;
          iconBtn.appendChild(
            svg(
              "M12 2.5l1.35 5.1L18.5 9 13.35 10.4 12 15.5l-1.35-5.1L5.5 9l5.15-1.4L12 2.5zm6.5 9.5l.7 2.65L22 15.5l-2.8.85L18.5 19l-.7-2.65L15 15.5l2.8-.85.7-2.65zM5.5 13.5l.55 2.1L8.2 16.2l-2.15.65L5.5 19l-.55-2.15L2.8 16.2l2.15-.6.55-2.1z"
            )
          );
          sendBtn.appendChild(
            svg("M12 4l-1.4 1.4 5.6 5.6H4v2h12.2l-5.6 5.6L12 20l8-8z")
          );
          iconBtn.addEventListener("click", function (event) {
            event.preventDefault();
            iconOpen = !iconOpen;
            if (iconOpen) dismissed = false;
            highlight = iconOpen ? 0 : -1;
            renderMenu();
            focusComposer();
          });
          sendBtn.addEventListener("click", function (event) {
            event.preventDefault();
            if (!localBusy) submit();
          });
          input.addEventListener("input", function () {
            dismissed = false;
            saveDraft();
            if (!iconOpen) highlight = filterCommands(input.value).length ? 0 : -1;
            if (!/^\s*\//.test(input.value) && !iconOpen) {
              iconOpen = false;
            }
            renderMenu();
          });
          input.addEventListener("paste", function () {
            setTimeout(function () {
              saveDraft();
              renderMenu();
            }, 0);
          });
          input.addEventListener("keydown", function (event) {
            var rows = visibleCommands();
            var open = rows.length > 0;
            if (open && event.key === "ArrowDown") {
              event.preventDefault();
              moveHighlight(1);
              return;
            }
            if (open && event.key === "ArrowUp") {
              event.preventDefault();
              moveHighlight(-1);
              return;
            }
            if (event.key === "Escape") {
              if (open || iconOpen) {
                event.preventDefault();
                iconOpen = false;
                dismissed = true;
                highlight = -1;
                renderMenu();
              }
              return;
            }
            if (event.key === "Enter" && event.shiftKey) {
              event.preventDefault();
              insertNewline();
              return;
            }
            if (event.key === "Enter") {
              event.preventDefault();
              if (open) {
                var index = highlight >= 0 ? highlight : 0;
                if (rows[index]) insert(rows[index].token);
                return;
              }
              if (!localBusy) submit();
            }
          });
        }

        function schedulePlace() {
          var win = parentWin();
          if (placeRaf) return;
          placeRaf = win.requestAnimationFrame(function () {
            placeRaf = 0;
            layout();
          });
        }

        function observeInsetTargets() {
          var win = parentWin();
          var doc = parentDoc();
          if (!doc || !win.ResizeObserver) return;
          if (!insetRO) {
            insetRO = new win.ResizeObserver(function () {
              schedulePlace();
            });
          }
          var targets = [
            doc.documentElement,
            doc.body,
            doc.querySelector('[data-testid="stSidebar"]'),
            doc.querySelector('[data-testid="stSidebarContent"]'),
            doc.querySelector('[data-testid="stAppViewContainer"]'),
            doc.querySelector('[data-testid="stMain"]'),
            doc.querySelector('[data-testid="stAppScrollToBottomContainer"]'),
            doc.getElementById("canvas-files-rail-host"),
          ];
          targets.forEach(function (el) {
            if (!el) return;
            if (observedNodes.indexOf(el) !== -1) return;
            try {
              insetRO.observe(el);
              observedNodes.push(el);
            } catch (err) {}
          });
        }

        function railsAreDragging(doc) {
          var rail = doc.getElementById("canvas-files-rail-host");
          if (rail && rail.getAttribute("data-resizing") === "true") return true;
          var sidebar = doc.querySelector('[data-testid="stSidebar"]');
          if (sidebar && /none/i.test(sidebar.style.userSelect || "")) return true;
          return false;
        }

        function hookPlacement() {
          if (placeHooked) return;
          placeHooked = true;
          var win = parentWin();
          var doc = parentDoc();
          var onPlace = function () {
            observeInsetTargets();
            schedulePlace();
          };
          try {
            win.addEventListener("resize", onPlace);
            if (win.visualViewport) win.visualViewport.addEventListener("resize", onPlace);
            if (doc) {
              doc.addEventListener(
                "pointermove",
                function () {
                  if (railsAreDragging(doc)) schedulePlace();
                },
                true
              );
              doc.addEventListener("pointerup", onPlace, true);
              doc.addEventListener(
                "click",
                function (event) {
                  var target = event.target;
                  if (!target || !target.closest) return;
                  if (
                    target.closest('[data-testid="stSidebarCollapseButton"]') ||
                    target.closest('[data-testid="stSidebarCollapsedControl"]') ||
                    target.closest(".files-rail-toggle")
                  ) {
                    var n = 0;
                    var tick = function () {
                      observeInsetTargets();
                      schedulePlace();
                      if (++n < 24) win.setTimeout(tick, 50);
                    };
                    tick();
                  }
                },
                true
              );
              if (win.MutationObserver) {
                var obs = new win.MutationObserver(function (records) {
                  var i;
                  for (i = 0; i < records.length; i += 1) {
                    var target = records[i].target;
                    if (
                      target &&
                      target.getAttribute &&
                      (target.getAttribute("data-canvas-command-picker-frame") === "1" ||
                        target.id === liveStyleId)
                    ) {
                      continue;
                    }
                    onPlace();
                    return;
                  }
                });
                obs.observe(doc.body, {
                  childList: true,
                  subtree: true,
                  attributes: true,
                  attributeFilter: [
                    "style",
                    "data-collapsed",
                    "aria-expanded",
                    "data-resizing",
                  ],
                });
              }
            }
            observeInsetTargets();
          } catch (err) {}
        }

        function afterStreamlitPaint(busy) {
          setBusy(!!busy);
          if (!busy) focusComposer();
          layout();
        }

        function render(args, theme) {
          args = args || {};
          liveStyleId = args.style_id || "canvas-command-picker-style";
          liveCommands = Array.isArray(args.commands) ? args.commands : [];
          livePlaceholder = args.placeholder || "What's due this week?";
          applyTheme(theme);
          input.setAttribute("placeholder", livePlaceholder);
          bindOnce();
          hookPlacement();
          restoreDraft();
          afterStreamlitPaint(!!args.busy);
          renderMenu();
        }

        window.addEventListener("message", function (event) {
          var data = event.data || {};
          if (data.type !== "streamlit:render") return;
          var args = data.args || {};
          var key = JSON.stringify(args);
          if (key === lastArgsKey && lastTheme === data.theme) {
            afterStreamlitPaint(!!args.busy);
            return;
          }
          lastArgsKey = key;
          lastTheme = data.theme;
          render(args, data.theme);
        });

        send("streamlit:componentReady", { apiVersion: API });
        setFrameHeight(78);
      })();
    </script>
  </body>
</html>
